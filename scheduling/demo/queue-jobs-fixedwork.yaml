# Queue demo, fixed-work variant: 3 identical Jobs, each requesting 1 GPU and running
# ITERS=2800 bf16 matmuls (about 45 s alone on the RTX 5070). With exclusive GPUs they
# queue and run one after another; under time-slicing they share the card.
# Needs the gpu-jobs namespace and gpu-bench ConfigMap (manifests/00, 40). Run with:
#   bash demo/run_queue_demo.sh exclusive-fixed demo/queue-jobs-fixedwork.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fixed-1
  namespace: gpu-jobs
  labels:
    demo: gpu-queue-fixed
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        demo: gpu-queue-fixed
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: bench
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["python", "/bench/bench.py"]
          env:
            - name: ITERS
              value: "2800"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: bench
              mountPath: /bench
      volumes:
        - name: bench
          configMap:
            name: gpu-bench
