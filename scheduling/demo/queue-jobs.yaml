# Queue demo, fixed-time variant: 3 identical Jobs, each requesting 1 GPU and running
# bf16 matmuls for DURATION=45 s. With one exclusive GPU, the 2nd and 3rd Jobs stay Pending
# (Insufficient nvidia.com/gpu) until the GPU frees up: the scheduler is the queue.
# Needs the gpu-jobs namespace and gpu-bench ConfigMap (manifests/00, 40). Run with:
#   bash demo/run_queue_demo.sh exclusive
---
apiVersion: batch/v1
kind: Job
metadata:
  name: queue-1
  namespace: gpu-jobs
  labels:
    demo: gpu-queue
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        demo: gpu-queue
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: bench
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["python", "/bench/bench.py"]
          env:
            - name: DURATION
              value: "45"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: bench
              mountPath: /bench
      volumes:
        - name: bench
          configMap:
            name: gpu-bench
