# Two-machine homelab Slurm cluster (Slurm 25.11, Ubuntu 26.04 packages on both sides).
#   controller: slurmctld in a container on hp-laptop (compose.yml), tailnet 100.73.132.95:6817
#   compute   : slurmd in WSL Ubuntu on the GPU PC (zakar), tailnet 100.88.71.33:6818
# Both ports are tailnet-only via `tailscale serve --tcp` (Windows side) -> 127.0.0.1.
ClusterName=homelab
SlurmctldHost=slurmctld(100.73.132.95)
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
CredType=cred/munge
SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

# WSL has cgroup v2 under systemd, but the controller container and WSL don't share a cgroup
# layout worth enforcing on one GPU box: track processes by parent PID, no task containment.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# without a default, a job that asks for no memory is given the whole node and blocks the rest
DefMemPerCPU=400
GresTypes=gpu

# No slurmdbd: completed-job records go to a text file (one line per job) for the write-up.
AccountingStorageType=accounting_storage/none
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

ReturnToService=2
SlurmdTimeout=120
MessageTimeout=30
KillWait=10
InactiveLimit=0
MinJobAge=600

# RealMemory: slurmd -C reports 15908 MB for the WSL VM; leave headroom for vLLM's container.
NodeName=zakpc NodeAddr=100.88.71.33 CPUs=28 Boards=1 SocketsPerBoard=1 CoresPerSocket=14 ThreadsPerCore=2 RealMemory=12000 Gres=gpu:rtx5070:1 State=UNKNOWN
PartitionName=gpu Nodes=zakpc Default=YES MaxTime=02:00:00 State=UP OverSubscribe=NO
