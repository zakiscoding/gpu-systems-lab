# Job template: 15 s bf16 matmul benchmark (bench.py from the gpu-bench ConfigMap, manifest 40)
# on 1 GPU. Not retried on failure; the finished Job is cleaned up after 24 h.
#   kubectl apply -f manifests/41-matmul-job.yaml && kubectl -n gpu-jobs logs -f job/matmul-bf16
apiVersion: batch/v1
kind: Job
metadata:
  name: matmul-bf16
  namespace: gpu-jobs
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: bench
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["python", "/bench/bench.py"]
          env:
            - name: DURATION
              value: "15"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: bench
              mountPath: /bench
      volumes:
        - name: bench
          configMap:
            name: gpu-bench
