# Time-sliced mode: the one physical GPU is advertised as nvidia.com/gpu: 4.
# Every replica sees the whole card (all 12 GB); there is no memory or fault isolation.
# Apply, then: kubectl -n kube-system rollout restart ds/nvidia-device-plugin
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4
