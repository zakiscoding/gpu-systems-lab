apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi
  namespace: gpu-jobs
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: nvidia-smi
      image: nvcr.io/nvidia/cuda:12.8.1-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
