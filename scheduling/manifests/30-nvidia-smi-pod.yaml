# Smoke test: a one-shot Pod that requests 1 GPU and runs nvidia-smi. If its log shows the
# RTX 5070, the device plugin, the nvidia RuntimeClass and GPU scheduling all work.
#   kubectl apply -f manifests/30-nvidia-smi-pod.yaml && kubectl -n gpu-jobs logs nvidia-smi
# Delete the Pod before re-applying: kubectl -n gpu-jobs delete pod nvidia-smi
apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi
  namespace: gpu-jobs
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: nvidia-smi
      image: nvcr.io/nvidia/cuda:12.8.1-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
