# L7 load balancer for OpenAI-compatible vLLM replicas.
global
    maxconn 4096
defaults
    mode http
    timeout connect 2s
    timeout client  120s
    timeout server  120s
    option http-keep-alive
frontend llm
    bind :8100
    default_backend vllm
backend vllm
    balance leastconn                       # long, uneven requests: send to the least-busy replica
    option httpchk GET /health
    http-check expect status 200
    # active checks every 1 s; 2 failures -> DOWN, 2 successes -> UP
    default-server inter 1s fall 2 rise 2 maxconn 64
    # L7 retries: a request that fails to connect or gets no response is re-sent to another replica.
    # Safe here because a completion has no side effects; POST bodies are buffered for it.
    retry-on conn-failure empty-response response-timeout
    retries 2
    option redispatch
    server r1 r1:8000 check
    server r2 r2:8000 check
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
