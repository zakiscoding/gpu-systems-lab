# Cloudflare Tunnel connector for zak-gpu-node. Outbound only: no published ports.
#
#   cp .env.example .env && chmod 600 .env   # paste TUNNEL_TOKEN (never commit .env)
#   docker compose up -d
#
# Start serving/ and observability/ first: their Docker networks must exist.
# The tunnel's configuration in Cloudflare decides what is reachable (see README.md).
name: cloudflare-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: .env  # TUNNEL_TOKEN (read by cloudflared from the environment)
    networks: [serving, observability]

networks:
  serving:
    external: true
    name: serving_default
  observability:
    external: true
    name: gpu-observability_default
