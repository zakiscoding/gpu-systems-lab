# Drop-in for gg-nightly.service: start the GPU PC's on-demand containers for the run and
# stop them afterwards, so they don't sit idle all day. Install:
#   install -D -m 644 regress/gg-nightly.on-demand.conf /etc/systemd/system/gg-nightly.service.d/on-demand.conf
#   install -m 755 regress/gpu-stack.sh /opt/gg-nightly/gpu-stack.sh && systemctl daemon-reload
# Remove the drop-in to go back to keeping them up all the time.
[Unit]
Requires=docker.service

[Service]
ExecStartPre=/opt/gg-nightly/gpu-stack.sh up
# Runs even if the benchmark fails. The result stays visible afterwards: node-exporter (always
# on) keeps serving the textfile nightly.py wrote.
ExecStopPost=/opt/gg-nightly/gpu-stack.sh down
