global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    node: zak-gpu-node

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels: {instance: zak-gpu-node}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: zak-gpu-node}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
