# Prometheus config for the observability stack (docker-compose.yml): scrape dcgm-exporter
# (GPU), node-exporter (host) and Prometheus itself every 5 s, and evaluate alerts.yml.
# Targets are compose service names. Mounted at /etc/prometheus/prometheus.yml; reload after
# edits with: curl -X POST <prometheus>:9090/-/reload (--web.enable-lifecycle is on).
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    node: zak-gpu-node

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels: {instance: zak-gpu-node}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: zak-gpu-node}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
