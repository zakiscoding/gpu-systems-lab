# Prometheus alerting rules for the GPU node: dcgm-exporter metrics (DCGM_FI_DEV_*) and its scrape status.
# Loaded via rule_files in prometheus.yml; mounted at /etc/prometheus/alerts.yml by
# docker-compose.yml. No Alertmanager is configured: firing alerts are visible on
# Prometheus's /alerts page. After editing: curl -X POST <prometheus>:9090/-/reload.
groups:
  - name: gpu
    rules:
      - alert: GPUTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} at {{ $value }} C (> 85 C for 2m)"

      - alert: GPUMemoryNearlyFull
        expr: DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL > 0.95
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory {{ $value | humanizePercentage }} used (> 95%)"

      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        labels: {severity: critical}
        annotations:
          summary: "GPU {{ $labels.gpu }} reported XID {{ $value }}"

      - alert: GPUExporterDown
        expr: up{job="dcgm"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "dcgm-exporter is not being scraped"

  - name: gpu-nightly-regression
    rules:
      # regress/nightly.py: a nightly GopherGrid matmul benchmark more than 5% below the median
      # of its previous 7 runs. Test runs carry a `label` and are excluded.
      - alert: GpuNightlyRegression
        expr: max by (precision) (gg_nightly_regression{label=""}) == 1
        labels: {severity: warning}
        annotations:
          summary: "Nightly matmul {{ $labels.precision }} more than 5% below its 7-run median"
      - alert: GpuNightlyJobMissing
        expr: time() - gg_nightly_last_run_timestamp_seconds > 2 * 86400 or gg_nightly_job_ok == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "The nightly GPU benchmark failed or hasn't run for 2 days"
