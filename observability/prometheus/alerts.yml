groups:
  - name: gpu
    rules:
      - alert: GPUTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} at {{ $value }} C (> 85 C for 2m)"

      - alert: GPUMemoryNearlyFull
        expr: DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL > 0.95
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory {{ $value | humanizePercentage }} used (> 95%)"

      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        labels: {severity: critical}
        annotations:
          summary: "GPU {{ $labels.gpu }} reported XID {{ $value }}"

      - alert: GPUExporterDown
        expr: up{job="dcgm"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "dcgm-exporter is not being scraped"
