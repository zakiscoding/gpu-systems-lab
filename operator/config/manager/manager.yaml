apiVersion: v1
kind: Namespace
metadata:
  name: gpujob-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpujob-operator
  namespace: gpujob-system
  labels:
    app.kubernetes.io/name: gpujob-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpujob-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpujob-operator
    spec:
      serviceAccountName: gpujob-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: gpujob-operator:dev
          imagePullPolicy: IfNotPresent   # the image is loaded into the cluster, not pulled
          args:
            - --leader-elect
            - --runtime-class=nvidia
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
